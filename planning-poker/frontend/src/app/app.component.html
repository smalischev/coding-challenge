<app-header [sessionId]="store.sessionId()" [currentUser]="store.currentUser().name" [currentRole]="store.currentUser().role"></app-header>
<main>
  <app-issue [issueId]="store.activeIssue().id" [title]="store.activeIssue().title" [description]="store.activeIssue().description"></app-issue>
  <div class="workspace">
    <app-participants [participants]="store.participants()" [currentUserName]="store.currentUser().name"></app-participants>
    <div class="round">
      @if (store.currentUser().role === 'Entwickler') {
        <app-estimation-cards [selected]="store.selectedCard()" (cardSelected)="store.selectCard($event)"></app-estimation-cards>
      } @else {
        <app-scrum-master-notice></app-scrum-master-notice>
      }
      @if (store.revealed()) { <app-results></app-results> }
      <app-moderator-controls [allEstimated]="store.allEstimated()" [revealed]="store.revealed()" (reveal)="store.revealRound()" (newRound)="store.startNewRound()"></app-moderator-controls>
    </div>
  </div>
</main>
