<section class="panel"><div class="heading"><div><h2>Deine Schätzung</h2><p>Wähle eine Karte. Deine Auswahl bleibt verdeckt.</p></div>@if (selectedCard) { <span class="chosen">Ausgewählt</span> }</div><div class="cards">@for (card of cards; track card) {<button type="button" [class.selected]="card === selectedCard" (click)="select(card)" [attr.aria-pressed]="card === selectedCard">{{ card }}</button>}</div></section>
