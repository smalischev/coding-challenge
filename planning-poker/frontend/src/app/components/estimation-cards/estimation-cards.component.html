<section class="panel"><div class="heading"><div><h2>Deine Schätzung</h2><p>Wähle eine Karte. Deine Auswahl bleibt verdeckt.</p></div>@if (selected) { <span class="chosen">Ausgewählt</span> }</div><div class="cards">@for (card of cards; track card) {<button type="button" [class.selected]="card === selected" (click)="select(card)" [attr.aria-pressed]="card === selected">{{ card }}</button>}</div></section>
