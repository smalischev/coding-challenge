<header>
  <div class="brand"><span class="mark">P</span><span>Planning Poker</span></div>
  <div class="meta">
    <div class="identity">
      <span>Du</span><strong>{{ currentUser }}</strong
      ><small>{{ currentRole }}</small
      ><button type="button" class="logout" (click)="logout.emit()">Sign out</button>
    </div>
    <div class="session">
      Session <strong>{{ sessionId }}</strong>
      <button
        type="button"
        class="copy-session-id"
        [attr.aria-label]="sessionIdCopied() ? 'Session-ID kopiert' : 'Session-ID kopieren'"
        (click)="copySessionId()"
      >
        {{ sessionIdCopied() ? '✓' : '⧉' }}
      </button>
      @if (sessionIdCopied()) {
        <span class="copy-confirmation">Kopiert</span>
      }
    </div>
  </div>
</header>
