<section class="controls">
  <div>
    <p class="label">Moderator</p>
    <strong>{{
      revealed ? 'Ergebnis für GitLab bestätigen.' : allEstimated ? 'Alle Teilnehmer haben geschätzt.' : 'Die Runde kann jederzeit aufgedeckt werden.'
    }}</strong>
  </div>
  @if (revealed) {
    <label class="result-value">
      <span>Ergebnis</span>
      <select [value]="selectedCard" (change)="selectedCard = $any($event.target).value">
        @for (card of cards; track card) {
          <option [value]="card">{{ card }}</option>
        }
      </select>
    </label>
    <button type="button" class="secondary" (click)="newRound.emit()">Neue Runde</button>
    <button type="button" class="primary" [disabled]="finalizing" (click)="finalize.emit(selectedCard)">
      {{ finalizing ? 'Wird übernommen…' : 'Nach GitLab übernehmen' }}
    </button>
  } @else {
    <button type="button" class="primary" (click)="reveal.emit()">Aufdecken</button>
  }
</section>
