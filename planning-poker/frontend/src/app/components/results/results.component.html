<section class="results">
  <div class="heading">
    <h2>Aufgedeckte Karten</h2>
    <span>Runde 1</span>
  </div>
  @if (error()) {
    <p>{{ error() }}</p>
  }
  <div class="estimates">
    @for (estimate of revealedEstimates(); track estimate.developerName) {
      <div>
        <b>{{ estimate.developerName }}</b>
        <strong>{{ estimate.value }}</strong>
      </div>
    }
  </div>
  <app-estimate-distribution-chart
    [groups]="estimateGroups()"
    [includeDemoEstimates]="true"
  ></app-estimate-distribution-chart>
  <div class="metrics">
    <div>
      <span>Durchschnitt</span><strong>{{ average() ?? '–' }}</strong>
    </div>
    <div>
      <span>Häufigster Wert</span><strong>{{ mostFrequentValue() ?? '–' }}</strong>
    </div>
  </div>
</section>
